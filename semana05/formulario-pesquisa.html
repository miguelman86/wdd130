<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>
<body>
    <header>
        <h1>WDD 130 | Formulário HTML - Pesquisa de Usuário</h1>
    </header>
    <main>

        <form>
            <fieldset>
                <legend>Informaçoes de contato</legend>
            
                <div class="item-formulario coluna2">
                    <label for="nomecompleto">Nome Completo:</label>
                    <input type="text" id="nome-completo" name="nome-completo" required>
                </div>

                <div class="item-formulario coluna2">
                    <label for="emaildousuario">E-mail:</label>
                    <input type="email" id="emaildousuario" name="emaildousuario" required>
                </div>

            </fieldset>
            <fieldset>
                <legend>Perguntas</legend>
            
                <div class="item-formulario coluna1">
                    <label for="navegador">Qual é o seu navegador favorito?</label>
                    <select id="navegador" name="navegador">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                    </select>
                </div>

                <div class="item-formulario coluna1">
                    <label for="pet">Você tem um animal de estimação?</label>
                    <input type="checkbox" id="pet" name="pet" required>
                </div>

                <div class="item-formulario">
                    <label for="feedback">Liste os lugares onde voce morou:</label>
                    <textarea id="feedback" name="feedback" rows="2" placeholder="Osasco, São Paulo, Rio de Janeiro"></textarea>
                </div>

                <button type="submit">Enviar Pesquisa</button>

            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2024 | Formulário HTML - Atividade de Pesquisa de Usuário | Miguel Jose Mansilla Avila</p>
    </footer>
</body>
</html>
